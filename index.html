
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализ остатков</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>Анализ остатков</h1>

    <section class="upload-section">

      <label class="file-label" for="excelFile">
        <span id="fileName">Выберите Excel-файл</span>
        <input
          type="file"
          id="excelFile"
          accept=".xlsx,.xls,.csv"
        >
      </label>

      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="results" hidden>
      <div class="results-tabs" role="tablist" aria-label="Списки товаров">
        <button
          type="button"
          id="centralTab"
          class="tab-button is-active"
          role="tab"
          aria-selected="true"
          aria-controls="resultsPanel"
        >Только на центральном</button>
        <button
          type="button"
          id="restockTab"
          class="tab-button"
          role="tab"
          aria-selected="false"
          aria-controls="resultsPanel"
        >Нужно пополнить</button>
      </div>

      <div id="resultsPanel" role="tabpanel" aria-labelledby="centralTab">
        <div id="restockViews" class="results-tabs restock-subtabs" role="tablist" aria-label="Списки пополнения" hidden>
          <button
            type="button"
            id="restockProductsTab"
            class="tab-button is-active"
            role="tab"
            aria-selected="true"
            aria-controls="resultsPanel"
          >К пополнению</button>
          <button
            type="button"
            id="restockExceptionsTab"
            class="tab-button"
            role="tab"
            aria-selected="false"
            aria-controls="resultsPanel"
          >Исключения</button>
        </div>

        <div class="results-header">
          <div>
            <h2 id="resultsTitle">Товары только на центральном складе</h2>
            <p id="resultCount" class="muted">Найдено: 0</p>
        <div id="exceptionsInfo" class="exceptions-info" hidden>
          <strong>Слова исключения</strong>
          <p id="exceptionsList" class="exceptions-list"></p>
        </div>

          </div>
          <button id="exportBtn" class="secondary-btn" disabled>
            Экспорт в Excel
          </button>
        </div>

        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Товар</th>
                <th>Штрихкод</th>
                <th id="stockHeader">Остаток ЦС</th>
                <th id="centralStockHeader" hidden>Остаток ЦС</th>
                <th>Цена</th>
              </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
          </table>
        </div>

        <p id="emptyMessage" class="empty-message" hidden></p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
