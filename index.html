
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Анализ остатков</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>Анализ остатков</h1>

    <section class="upload-section">
      <h2>Загрузка Excel</h2>

      <label class="file-label" for="excelFile">
        <span id="fileName">Выберите Excel-файл</span>
        <input
          type="file"
          id="excelFile"
          accept=".xlsx,.xls,.csv"
        >
      </label>

      <button id="analyzeBtn" disabled>Проверить остатки</button>
      <p id="status" class="status" aria-live="polite"></p>
    </section>

    <section id="results" hidden>
      <div class="results-header">
        <div>
          <h2>Товары только на центральном складе</h2>
          <p id="resultCount" class="muted">Найдено: 0</p>
        </div>
        <button id="exportBtn" class="secondary-btn" disabled>
          Экспорт в Excel
        </button>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Товар</th>
              <th>Штрихкод</th>
              <th>Остаток</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>

      <p id="emptyMessage" class="empty-message" hidden>
        Товаров, которые есть только на центральном складе, не найдено.
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
