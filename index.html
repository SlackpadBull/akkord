<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Анализ остатков</title>
        <link rel="icon" type="image/png" href="icon.png" />
        <link rel="stylesheet" href="style.css" />
        <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    </head>

    <body>
        <main class="container">
            <section class="upload-section">
                <label class="file-label" for="excelFile">
                    <span class="upload-title">Анализ остатков</span>
                    <span class="file-action">
                        <span class="action-name">Анализ</span>
                        <span id="fileName">Выберите Excel-файл</span>
                        <svg class="retry-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 7v5h-5M4 17v-5h5"></path>
                            <path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"></path>
                        </svg>
                    </span>
                    <input type="file" id="excelFile" accept=".xlsx,.xls,.csv" />
                </label>

                <p id="status" class="status" aria-live="polite"></p>
            </section>

            <section id="results" hidden>
                <div class="results-tabs" role="tablist" aria-label="Списки товаров">
                    <button
                        type="button"
                        id="centralTab"
                        class="tab-button is-active"
                        role="tab"
                        aria-selected="true"
                        aria-controls="resultsPanel">
                        Только на центральном 0
                    </button>
                    <button
                        type="button"
                        id="restockTab"
                        class="tab-button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="resultsPanel">
                        Нужно пополнить 0
                    </button>
                    <button
                        type="button"
                        id="transferTab"
                        class="tab-button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="transferPanel">
                        Перемещение 0
                    </button>
                    <button
                        type="button"
                        id="allStockTab"
                        class="tab-button"
                        role="tab"
                        aria-selected="false"
                        aria-controls="resultsPanel">
                        Все остатки 0
                    </button>
                </div>

                <div id="resultsPanel" role="tabpanel" aria-labelledby="centralTab">
                    <div class="results-header">
                        <div class="results-heading">
                            <h2 id="resultsTitle">Товары только на центральном складе</h2>
                            <button type="button" id="exceptionsLink" class="text-link" hidden>Исключения</button>
                            <button type="button" id="restockBackLink" class="text-link" hidden>
                                ← К товарам к пополнению
                            </button>
                            <div id="exceptionsInfo" class="exceptions-info" hidden>
                                <p id="exceptionsList" class="exceptions-list"></p>
                                <p id="exceptionsAllowedInfo" class="exceptions-allowed">
                                    <strong>Разрешено:</strong>
                                    <span id="exceptionsAllowed"></span>
                                </p>
                            </div>
                        </div>
                        <button id="exportBtn" class="secondary-btn" disabled hidden>Экспорт в Excel</button>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr id="resultsHeadings"></tr>
                            </thead>
                            <tbody id="resultsBody"></tbody>
                        </table>
                    </div>

                    <div id="stopSection" class="stop-section" hidden>
                        <h3 class="stop-title">На стопе</h3>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr id="stopResultsHeadings"></tr>
                                </thead>
                                <tbody id="stopResultsBody"></tbody>
                            </table>
                        </div>
                    </div>

                    <p id="emptyMessage" class="empty-message" hidden></p>
                </div>

                <div id="transferPanel" role="tabpanel" aria-labelledby="transferTab" hidden>
                    <div class="results-header">
                        <div class="results-heading">
                            <h2>Таблица на перемещение</h2>
                            <button type="button" id="transferExcludedLink" class="text-link" hidden>
                                Не вошло в перемещение
                            </button>
                            <button type="button" id="transferBackLink" class="text-link" hidden>
                                ← К товарам в перемещение
                            </button>
                        </div>
                        <div class="transfer-actions">
                            <button id="transferPrintBtn" class="secondary-btn" disabled>Печать</button>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>Название</th>
                                    <th class="count-column">Ак</th>
                                    <th class="central-stock-column">ЦС</th>
                                    <th class="price-column">Цена</th>
                                    <th class="same-width-column">Перемещение</th>
                                </tr>
                            </thead>
                            <tbody id="transferBody"></tbody>
                        </table>
                    </div>
                    <p id="transferEmptyMessage" class="empty-message" hidden>
                        В таблице на перемещение пока нет товаров.
                    </p>
                    <div class="transfer-export-actions">
                        <button id="transferExportBtn" class="secondary-btn" disabled>Экспорт в Excel</button>
                    </div>
                </div>

                <dialog id="transferPrintDialog" class="print-position-dialog" aria-labelledby="printPositionTitle">
                    <div class="print-position-heading">
                        <h2 id="printPositionTitle">Где печатать?</h2>
                        <form method="dialog">
                            <button class="print-position-cancel" type="submit">Отмена</button>
                        </form>
                    </div>
                    <div class="print-position-options">
                        <button type="button" class="print-position-option" data-print-position="top">
                            <span class="print-sheet-preview is-top" aria-hidden="true">
                                <span class="print-sheet-half"></span>
                                <span class="print-sheet-half"></span>
                            </span>
                            <span>Сверху</span>
                        </button>
                        <button type="button" class="print-position-option" data-print-position="bottom">
                            <span class="print-sheet-preview is-bottom" aria-hidden="true">
                                <span class="print-sheet-half"></span>
                                <span class="print-sheet-half"></span>
                            </span>
                            <span>Снизу</span>
                        </button>
                        <button type="button" class="print-position-option" data-print-position="full" hidden>
                            <span class="print-sheet-preview is-full" aria-hidden="true">
                                <span class="print-sheet-area"></span>
                            </span>
                            <span>Весь лист</span>
                        </button>
                    </div>
                    <div id="transferPrintDate" class="print-date-options" role="radiogroup" aria-label="Дата накладной">
                        <button type="button" class="print-date-option" role="radio" aria-checked="false" tabindex="-1" data-print-date="today">
                            На сегодня
                        </button>
                        <button type="button" class="print-date-option is-selected" role="radio" aria-checked="true" aria-disabled="true" tabindex="0" data-print-date="tomorrow">
                            На завтра
                        </button>
                    </div>
                </dialog>
            </section>
        </main>

        <div id="pageScrollbar" class="page-scrollbar" role="scrollbar" aria-label="Прокрутка страницы" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0" hidden>
            <div class="page-scrollbar-thumb"></div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
